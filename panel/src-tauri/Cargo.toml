[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0.120"
serde = { version = "1.0.204", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"

# Dependencies from Service
anyhow = "1.0.100"
axum = { version = "0.7.5", features = ["ws"] }
juniper = "0.17.0"
reqwest = "0.12.5"
rmcp = { version = "0.12.0", features = ["server"] }
sqlx = { version = "0.8.0", features = ["postgres"] }
tokio = { version = "1.38.0", features = ["full"] }
tokio-serial = "5.4.4"
aerosmart-shared = { path = "../../shared", features = ["sql", "serde", "graphql"] }
thiserror = "1.0.61"
tower-http = { version = "0.5.2", features = ["cors", "trace", "fs"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
clap = { version = "4.5.9", features = ["derive"] }
rkyv = { version = "0.8.13", default-features = false, features = ["std"] }
chrono = { version = "0.4.38", features = ["serde"] }
futures = "0.3.30"
toml = "0.9.11"
