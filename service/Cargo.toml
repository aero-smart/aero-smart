[package]
name = "panel"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.7.5", features = ["ws"] } # Downgrade to 0.7.x for better compatibility or stick to 0.8 if confident, but 0.8 is very new. Let's use 0.7 for stability with tower-http
juniper = "0.17.0"
reqwest = "0.12.5"
rmcp = { version = "0.12.0", features = ["server"] }
serde = { version = "1.0.204", features = ["derive"] }
sqlx = { version = "0.8.0", features = ["postgres"] }
tokio = { version = "1.38.0", features = ["full"] }
tokio-serial = "5.4.4"
aerosmart-shared = { path = "../shared", features = [
  "sql",
  "serde",
  "graphql",
] }
thiserror = "1.0.61"
tower-http = { version = "0.5.2", features = ["cors", "trace", "fs"] }
serde_json = "1.0.120"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
clap = { version = "4.5.9", features = ["derive"] }
rkyv = { version = "0.8.13", default-features = false, features = ["std"] }
chrono = { version = "0.4.38", features = ["serde"] }
futures = "0.3.30"
