name: Build Tauri App for OrangePi Zero 3 (aarch64)

on:
  push:
    branches: ["main"]
    paths:
      - "panel/**"
      - "shared/**"
      - ".github/workflows/build-aarch64.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "panel/**"
      - "shared/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-aarch64:
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.20.0'

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update &&
          sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          webkit2gtk-driver \
          xvfb \
          protobuf-compiler

      - name: Configure Cargo for cross-compilation
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          rustflags = ["-C", "link-arg=-Wl,--allow-multiple-definition"]
          EOF
          cat ~/.cargo/config.toml

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-aarch64-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-aarch64-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            target
            panel/src-tauri/target
          key: ${{ runner.os }}-cargo-build-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-aarch64-

      - name: Install frontend dependencies
        working-directory: panel
        run: pnpm install

      - name: Setup pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build Tauri app for aarch64
        working-directory: panel
        run: |
          # Build the Tauri application for aarch64
          npx tauri build --target aarch64-unknown-linux-gnu --verbose

      - name: List built artifacts
        run: |
          echo "=== Listing built artifacts ==="
          find target/aarch64-unknown-linux-gnu/release/bundle -type f

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          # Copy AppImage
          # user provided path: /home/runner/work/aero-smart/aero-smart/target/aarch64-unknown-linux-gnu/release/bundle/appimage/aero-smart-panel_0.1.0_aarch64.AppImage
          if [ -d "target/aarch64-unknown-linux-gnu/release/bundle/appimage" ]; then
            cp -v target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage artifacts/ || true
          else
            echo "AppImage directory not found at target/aarch64-unknown-linux-gnu/release/bundle/appimage"
          fi

          # Copy Deb package
          if [ -d "target/aarch64-unknown-linux-gnu/release/bundle/deb" ]; then
            cp -v target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb artifacts/ || true
          else
             echo "Deb directory not found at target/aarch64-unknown-linux-gnu/release/bundle/deb"
          fi
          
          # Try to find artifacts if not found (debugging)
          if [ -z "$(ls -A artifacts/)" ]; then
             echo "Artifacts folder is empty, searching for files..."
             find target -name "*.AppImage"
             find target -name "*.deb"
          fi
          
          # List artifacts to be uploaded
          ls -lh artifacts/

      - name: Create release info
        run: |
          echo "# Build Info" > artifacts/BUILD_INFO.txt
          echo "Branch: ${{ github.ref_name }}" >> artifacts/BUILD_INFO.txt
          echo "Commit: ${{ github.sha }}" >> artifacts/BUILD_INFO.txt
          echo "Date: $(date -u)" >> artifacts/BUILD_INFO.txt
          echo "Target: aarch64-unknown-linux-gnu (OrangePi Zero 3)" >> artifacts/BUILD_INFO.txt
          cat artifacts/BUILD_INFO.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aero-smart-panel-aarch64-${{ github.sha }}
          path: |
            artifacts/*.deb
            artifacts/BUILD_INFO.txt
          if-no-files-found: warn
          retention-days: 30
